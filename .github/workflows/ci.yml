name: CI

# The quality gate for every change: release.yml only runs when a release is
# cut by hand, so without this nothing checks main or a pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        # Tests never sign in; the asset only has to exist for the build.
        run: cp .env.example .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        # Fails if pubspec.lock is out of date with pubspec.yaml, so CI tests
        # exactly the dependency versions that are committed.
        run: flutter pub get --enforce-lockfile

      - name: Flutter Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Run Tests
        run: flutter test
