name: CI

# release.yml only runs on a hand-cut release, so this is the only check on main and PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        # Tests never sign in; the asset only has to exist for the build.
        run: cp .env.example .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake clang pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Install Dependencies
        # Fails on a stale pubspec.lock, so CI tests exactly the committed versions.
        run: flutter pub get --enforce-lockfile

      - name: Flutter Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Build Linux (Verification)
        run: flutter build linux --debug
