name: Build and Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        # Tests never sign in; the asset only has to exist for the build.
        run: cp .env.example .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned so a release is built with the SDK its tests ran on.
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Flutter Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Run Tests
        run: flutter test

  build-android:
    name: Build Android
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          # A build without the OAuth client ID compiles fine but cannot sign
          # anyone in, so a missing secret fails the job instead.
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned so a release is built with the SDK its tests ran on.
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Set up Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Never skipped: without the upload key a release build must fail,
          # not fall back to another key (see android/app/build.gradle.kts).
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; release APKs cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Build APKs
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          flutter build apk --release --split-per-abi

          shopt -s nullglob
          APK_FILES=(build/app/outputs/flutter-apk/app-*-release.apk)
          shopt -u nullglob
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No split APKs found in build/app/outputs/flutter-apk/. Check the Flutter build logs above and verify the project still supports ABI split APK output."
            exit 1
          fi

          for APK in "${APK_FILES[@]}"; do
            FILE_NAME=$(basename "$APK")
            ABI=${FILE_NAME#app-}
            ABI=${ABI%-release.apk}
            cp "$APK" "android-mangabaka-app-v${VERSION_CLEAN}-${ABI}.apk"
          done
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: android-mangabaka-app-v*.apk

  build-windows:
    name: Build Windows
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          # A build without the OAuth client ID compiles fine but cannot sign
          # anyone in, so a missing secret fails the job instead.
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned so a release is built with the SDK its tests ran on.
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Extract clean version from pubspec.yaml
          $versionLine = Get-Content pubspec.yaml | Select-String "^version:"
          $versionFull = ($versionLine -split " ")[1].Trim()
          $versionClean = ($versionFull -split "\+")[0]

          # Compile Inno Setup Script
          iscc /DAppVersion=$versionClean windows_installer.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: windows-mangabaka-app-v*.exe

  build-macos:
    name: Build macOS
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Match the iOS job on Xcode 26.x so both Apple builds use a current SDK
      # (Apple mandates Xcode 26 for App Store submissions as of 2026).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Import macOS Certificates
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Sign macOS App Bundle
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Application bundle (.app) not found in build directory!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          xattr -cr "$APP_PATH"
          chmod -R +x "$APP_PATH"

          if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID identity..."
            codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          else
            echo "::warning::MACOS_CERTIFICATE_BASE64 or MACOS_SIGNING_IDENTITY not set; falling back to ad-hoc signing."
            find "$APP_PATH" -name "*.dylib" -exec codesign --force --sign - {} \;
            find "$APP_PATH" -name "*.framework" -depth -exec codesign --force --sign - {} \;
            codesign --force --sign - "$APP_PATH/Contents/MacOS/MangaBaka"
            codesign --force --sign - "$APP_PATH"
          fi

      - name: Package DMG
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p build/macos/Release temp_dir
          cp -R "$APP_PATH" temp_dir/
          ln -s /Applications temp_dir/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder temp_dir -ov -format UDZO "build/macos/Release/macos-mangabaka-app-v${VERSION_CLEAN}.dmg"
          rm -rf temp_dir

      - name: Notarize DMG (when Apple API Key is configured)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' && env.ASC_KEY != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' }}
        run: |
          DMG_PATH=$(find build/macos/Release -name "*.dmg" | head -n 1)
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG_PATH"
          if echo "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$ASC_KEY" > asc_key.p8
          else
            echo "$ASC_KEY" | base64 --decode > asc_key.p8
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --key asc_key.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          rm -f asc_key.p8

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: build/macos/Release/macos-mangabaka-app-v*.dmg

  build-ios:
    name: Build iOS
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # device_info_plus 13.1.0 references the iOS 26.1 selector `isiOSAppOnVision`,
      # which is only declared in the iOS 26.1+ SDK. The macos-latest default Xcode
      # (16.x, iOS 18 SDK) can't compile it, so pin to the latest stable Xcode 26.x.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Import iOS Certificates
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' }}
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install iOS Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        if: ${{ env.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/appstore.mobileprovision

      - name: Build iOS Archive
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ]; then
            flutter build ipa --release
          else
            flutter build ipa --release --no-codesign
          fi

      - name: Package iOS Artifact
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          if [ -d "build/ios/ipa" ]; then
            ipa_file=$(find build/ios/ipa -name "*.ipa" | head -n 1)
            if [ -n "$ipa_file" ]; then
              cp "$ipa_file" "$GITHUB_WORKSPACE/ios-mangabaka-app-v${VERSION_CLEAN}.ipa"
              echo "Packaged IPA"
            fi
          else
            xcarchive_path=$(find build/ios/archive -name "*.xcarchive" | head -n 1)
            if [ -n "$xcarchive_path" ]; then
              cd "$(dirname "$xcarchive_path")"
              zip -r "$GITHUB_WORKSPACE/ios-mangabaka-app-v${VERSION_CLEAN}.xcarchive.zip" "$(basename "$xcarchive_path")"
              cd -
              echo "Packaged Unsigned xcarchive zip"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: |
            ios-mangabaka-app-v*.ipa
            ios-mangabaka-app-v*.xcarchive.zip

  build-ios-sideload:
    name: Build iOS (Sideload IPA)
    needs: analyze-and-test
    runs-on: macos-latest
    env:
      ZSIGN_VERSION: "0.7"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign

      - name: Package and Sign Sideload IPA
        env:
          P12_BASE64: ${{ secrets.SIDELOAD_P12_CERTIFICATE }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.SIDELOAD_PROVISIONING_PROFILE }}
          P12_PASSWORD: ${{ secrets.SIDELOAD_P12_PASSWORD }}
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          RUNNER_APP=$(find build/ios/iphoneos -maxdepth 1 -name "Runner.app" | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "Error: Runner.app not found in build/ios/iphoneos/"
            exit 1
          fi
          mkdir -p build/ios/iphoneos/Payload
          cp -R "$RUNNER_APP" build/ios/iphoneos/Payload/Runner.app

          if [ -n "$P12_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ] && [ -n "$P12_PASSWORD" ]; then
            echo "$P12_BASE64" | base64 --decode > certificate.p12
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
            curl -sL -o zsign.zip "https://github.com/zhlynn/zsign/releases/download/v${ZSIGN_VERSION}/zsign-v${ZSIGN_VERSION}-macos-x64.zip"
            unzip -q zsign.zip
            chmod +x zsign 2>/dev/null || chmod +x zsign-* 2>/dev/null || true
            if [ -f "./zsign" ]; then
              ZSIGN_EXEC="./zsign"
            else
              ZSIGN_EXEC=$(ls zsign* 2>/dev/null | head -n 1)
            fi
            if [ -z "$ZSIGN_EXEC" ]; then
              echo "Error: zsign binary not found after extracting zip"
              exit 1
            fi
            $ZSIGN_EXEC -f -k ./certificate.p12 -p "$P12_PASSWORD" -m ./profile.mobileprovision ./build/ios/iphoneos/Payload/Runner.app
          else
            echo "::warning::No sideload signing secrets provided — building unsigned .ipa"
          fi

          cd build/ios/iphoneos
          zip -qr "$GITHUB_WORKSPACE/ios-mangabaka-app-v${VERSION_CLEAN}-sideload.ipa" Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-artifact
          path: ios-mangabaka-app-v*-sideload.ipa

  build-linux:
    name: Build Linux
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: bash
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing; the build would ship without OAuth configuration."
            exit 1
          fi
          echo "$ENV_FILE" > .env

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake clang pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            fuse libfuse2 rpm
          wget -qO appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package AppImage
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          # Create AppDir structure
          rm -rf AppDir && mkdir -p AppDir/usr/{bin,share/icons/hicolor/512x512/apps,share/applications,lib}
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          
          # Copy icon
          cp assets/mangabaka512.png AppDir/usr/share/icons/hicolor/512x512/apps/mangabaka.png
          cp assets/mangabaka512.png AppDir/mangabaka.png
          cp assets/mangabaka512.png AppDir/.DirIcon

          # Copy desktop file
          cp linux/mangabaka.desktop AppDir/mangabaka.desktop
          cp linux/mangabaka.desktop AppDir/usr/share/applications/mangabaka.desktop

          # Create AppRun script
          printf '%s\n' \
            '#!/bin/sh' \
            'SELF=$(readlink -f "$0")' \
            'HERE=${SELF%/*}' \
            'export PATH="${HERE}/usr/bin/:${PATH}"' \
            'export LD_LIBRARY_PATH="${HERE}/usr/bin/lib/:${HERE}/usr/lib/:${LD_LIBRARY_PATH}"' \
            'exec "${HERE}/usr/bin/mangabaka_app" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun

          # Build AppImage
          ARCH=x86_64 /usr/local/bin/appimagetool --appimage-extract-and-run AppDir "build/linux/x64/release/linux-mangabaka-app-v${VERSION_CLEAN}.AppImage"

      - name: Package Tarball
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          tar czf "build/linux/x64/release/linux-mangabaka-app-v${VERSION_CLEAN}.tar.gz" -C build/linux/x64/release/bundle .

      - name: Package DEB
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          DEB_DIR="deb_build/mangabaka_${VERSION_CLEAN}_amd64"
          mkdir -p "$DEB_DIR"/DEBIAN
          mkdir -p "$DEB_DIR"/usr/lib/mangabaka
          mkdir -p "$DEB_DIR"/usr/bin
          mkdir -p "$DEB_DIR"/usr/share/applications
          mkdir -p "$DEB_DIR"/usr/share/icons/hicolor/512x512/apps

          cp -r build/linux/x64/release/bundle/* "$DEB_DIR"/usr/lib/mangabaka/
          ln -sf /usr/lib/mangabaka/mangabaka_app "$DEB_DIR"/usr/bin/mangabaka_app
          cp linux/mangabaka.desktop "$DEB_DIR"/usr/share/applications/
          cp assets/mangabaka512.png "$DEB_DIR"/usr/share/icons/hicolor/512x512/apps/mangabaka.png

          cat <<EOF > "$DEB_DIR"/DEBIAN/control
Package: mangabaka
Version: ${VERSION_CLEAN}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: MangaBaka <dev.oazzies.mangabaka>
Description: MangaBaka - Official MangaBaka desktop app
EOF

          dpkg-deb --build "$DEB_DIR" "build/linux/x64/release/linux-mangabaka-app-v${VERSION_CLEAN}.deb"

      - name: Package RPM
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          mkdir -p rpm_build/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -r build/linux/x64/release/bundle rpm_build/SOURCES/mangabaka-${VERSION_CLEAN}
          tar czf rpm_build/SOURCES/mangabaka-${VERSION_CLEAN}.tar.gz -C rpm_build/SOURCES mangabaka-${VERSION_CLEAN}

          mkdir -p rpm_build/SOURCES/usr/share/icons/hicolor/512x512/apps
          cp assets/mangabaka512.png rpm_build/SOURCES/usr/share/icons/hicolor/512x512/apps/mangabaka.png
          cp linux/mangabaka.desktop rpm_build/SOURCES/mangabaka.desktop

          {
            printf 'Name: mangabaka\n'
            printf 'Version: %s\n' "${VERSION_CLEAN}"
            printf 'Release: 1%%{?dist}\n'
            printf 'Summary: MangaBaka - Official MangaBaka desktop app\n'
            printf 'License: Apache-2.0\n'
            printf 'Source0: %%{name}-%%{version}.tar.gz\n'
            printf 'BuildArch: x86_64\n'
            printf '\n'
            printf '%%description\n'
            printf 'MangaBaka is a Flutter-based manga tracking application.\n'
            printf '\n'
            printf '%%prep\n'
            printf '%%setup -q\n'
            printf '\n'
            printf '%%install\n'
            printf 'mkdir -p %%{buildroot}/usr/lib/mangabaka\n'
            printf 'mkdir -p %%{buildroot}/usr/bin\n'
            printf 'mkdir -p %%{buildroot}/usr/share/applications\n'
            printf 'mkdir -p %%{buildroot}/usr/share/icons/hicolor/512x512/apps\n'
            printf 'cp -r * %%{buildroot}/usr/lib/mangabaka/\n'
            printf 'ln -sf /usr/lib/mangabaka/mangabaka_app %%{buildroot}/usr/bin/mangabaka_app\n'
            printf 'cp %%{_sourcedir}/mangabaka.desktop %%{buildroot}/usr/share/applications/mangabaka.desktop\n'
            printf 'cp %%{_sourcedir}/usr/share/icons/hicolor/512x512/apps/mangabaka.png %%{buildroot}/usr/share/icons/hicolor/512x512/apps/mangabaka.png\n'
            printf '\n'
            printf '%%files\n'
            printf '/usr/lib/mangabaka/*\n'
            printf '/usr/bin/mangabaka_app\n'
            printf '/usr/share/applications/mangabaka.desktop\n'
            printf '/usr/share/icons/hicolor/512x512/apps/mangabaka.png\n'
          } > rpm_build/SPECS/mangabaka.spec

          rpmbuild --define "_topdir $(pwd)/rpm_build" -ba rpm_build/SPECS/mangabaka.spec
          mv rpm_build/RPMS/x86_64/*.rpm "build/linux/x64/release/linux-mangabaka-app-v${VERSION_CLEAN}.rpm"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: |
            build/linux/x64/release/linux-mangabaka-app-v*.AppImage
            build/linux/x64/release/linux-mangabaka-app-v*.tar.gz
            build/linux/x64/release/linux-mangabaka-app-v*.deb
            build/linux/x64/release/linux-mangabaka-app-v*.rpm

  create-draft-release:
    name: Create Draft Release
    needs: [build-android, build-windows, build-macos, build-ios, build-ios-sideload, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION_FULL=$(echo "$VERSION_LINE" | cut -d' ' -f2)
          VERSION_CLEAN=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          echo "VERSION_CLEAN=$VERSION_CLEAN" >> $GITHUB_ENV

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_CLEAN}" release-artifacts/* \
            --title "MangaBaka App v${VERSION_CLEAN}" \
            --draft \
            --generate-notes
